# Type ZOMBIE on purpose: MythicMobs radius targeters (@MobsInRadius, @MobsNearOrigin) and the signal
# mechanic never reach ARMOR_STAND mobs, so spells could not wake an armor-stand crystal. The mob is
# invisible and frozen; only the amethyst head remains visible.
Hg_RunicCrystal:
  Type: ZOMBIE
  Display: '&dOude Runensteen'
  Health: 20
  Options:
    Invincible: true
    Silent: true
    NoAI: true
    NoGravity: true
    PreventOtherDrops: true
    Despawn: false
    Persistent: true
  DamageModifiers:
    - ALL 0
  Equipment:
    - AMETHYST_BLOCK HEAD
  Skills:
    - potion{type=INVISIBILITY;duration=1000000;level=0;force=true} @self ~onSpawn
    - skill:Hg_RunicCrystal_Ambient ~onTimer:20
    - skill:Puzzle_RunicCrystal_Activate ~onSignal:RUNEN_ACTIVEER
